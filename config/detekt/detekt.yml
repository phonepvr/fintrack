build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInObjects: 30
    thresholdInInterfaces: 30
    thresholdInEnums: 30

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

naming:
  active: true
  FunctionNaming:
    functionPattern: '^([a-z$][a-zA-Z$0-9]*)|(`.*`)$'
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

performance:
  active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    max: 5
  UnusedPrivateMember:
    active: true
  UseDataClass:
    active: false
  ForbiddenComment:
    active: false

# ktlint rules from detekt-formatting
formatting:
  active: true
  android: true
  autoCorrect: false
  Indentation:
    indentSize: 4
  MaximumLineLength:
    maxLineLength: 140
  NoWildcardImports:
    active: true
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
