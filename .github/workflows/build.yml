name: Build APK

on:
  push:
    branches:
      - claude/android-portfolio-tracker-ciOgJ
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print build environment
        run: |
          echo "JDK:"
          java -version 2>&1
          echo ""
          echo "Gradle:"
          ./gradlew --version --no-daemon 2>&1 | head -20
          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" | head -5 || true

      - name: Compile main sources
        id: compile
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --info 2>&1 | tee /tmp/compile.log
        continue-on-error: true

      - name: Build debug APK
        id: assemble
        if: steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assemble.log
        continue-on-error: true

      - name: Unit tests
        id: tests
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/tests.log
        continue-on-error: true

      - name: Detekt
        id: detekt
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew detekt --no-daemon --stacktrace 2>&1 | tee /tmp/detekt.log || true
        continue-on-error: true

      - name: Locate APK
        id: locate
        if: steps.assemble.outcome == 'success'
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        if: steps.locate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Write step summary on failure
        if: always()
        run: |
          {
            echo "# Build summary"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| compile | ${{ steps.compile.outcome }} |"
            echo "| assemble | ${{ steps.assemble.outcome }} |"
            echo "| tests | ${{ steps.tests.outcome }} |"
            echo "| detekt | ${{ steps.detekt.outcome }} |"
            echo "| locate APK | ${{ steps.locate.outcome }} |"
            echo ""
            for f in /tmp/compile.log /tmp/assemble.log /tmp/tests.log /tmp/detekt.log; do
              if [ -f "$f" ]; then
                echo "## Tail of $(basename "$f")"
                echo ""
                echo '```'
                tail -120 "$f"
                echo '```'
                echo ""
              fi
            done
            for xml in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
              if grep -q '<failure\|<error' "$xml" 2>/dev/null; then
                echo "## Failed test: $xml"
                echo ""
                echo '```xml'
                cat "$xml"
                echo '```'
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if any required step failed
        if: |
          steps.compile.outcome != 'success' ||
          steps.assemble.outcome != 'success' ||
          (steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped')
        run: |
          echo "::error::Build pipeline incomplete. compile=${{ steps.compile.outcome }} assemble=${{ steps.assemble.outcome }} tests=${{ steps.tests.outcome }}"
          exit 1
