name: Build APK

on:
  push:
    branches:
      - claude/android-portfolio-tracker-ciOgJ
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile main sources
        # Surfaces main-source compilation errors directly in the log.
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build debug APK
        # Spec §6 privacy gate is enforced via the Unit tests step below; this
        # step still runs first so we ALWAYS get an APK artifact uploaded,
        # even if a test regresses. The job will be marked failed at the end
        # if the tests didn't pass.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests (privacy gate + data)
        id: tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --continue
        continue-on-error: true

      - name: Detekt
        run: ./gradlew detekt --no-daemon --stacktrace
        continue-on-error: true

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail job if unit tests failed
        # The APK is already uploaded by this point, so the user always gets
        # an installable build, but the job goes red if the privacy gate didn't pass.
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed; see unit-test-reports artifact for details. APK was still produced."
          exit 1
