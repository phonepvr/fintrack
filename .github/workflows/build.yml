name: Build APK

on:
  push:
    branches:
      - claude/android-portfolio-tracker-ciOgJ
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile main + test sources
        # Surfaces compilation errors directly in the log before tests start.
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin --no-daemon --stacktrace

      - name: Unit tests (privacy gate + data)
        # Spec §6: every privacy gate must pass before we even build the APK.
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Detekt
        run: ./gradlew detekt --no-daemon --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
