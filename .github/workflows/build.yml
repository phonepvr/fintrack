name: Build APK

on:
  push:
    branches:
      - claude/android-portfolio-tracker-ciOgJ
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required so the diagnostic-snapshot step can push back to the branch

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Print build environment
        run: |
          echo "JDK:"
          java -version 2>&1
          echo ""
          echo "Gradle:"
          ./gradlew --version --no-daemon 2>&1 | head -20
          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" | head -5 || true

      - name: Compile main sources
        id: compile
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --info 2>&1 | tee /tmp/compile.log
        continue-on-error: true

      - name: Build debug APK
        id: assemble
        if: steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assemble.log
        continue-on-error: true

      - name: Unit tests
        id: tests
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/tests.log
        continue-on-error: true

      - name: Detekt
        id: detekt
        if: steps.assemble.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew detekt --no-daemon --stacktrace 2>&1 | tee /tmp/detekt.log || true
        continue-on-error: true

      - name: Locate APK
        id: locate
        if: steps.assemble.outcome == 'success'
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        if: steps.locate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Write diagnostic summary
        if: always()
        run: |
          mkdir -p .ci_diag
          OUT=.ci_diag/last-run.md
          {
            echo "# Build summary (run ${{ github.run_id }}, sha ${{ github.sha }})"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| compile | ${{ steps.compile.outcome }} |"
            echo "| assemble | ${{ steps.assemble.outcome }} |"
            echo "| tests | ${{ steps.tests.outcome }} |"
            echo "| detekt | ${{ steps.detekt.outcome }} |"
            echo "| locate APK | ${{ steps.locate.outcome }} |"
            echo ""
            for f in /tmp/compile.log /tmp/assemble.log /tmp/tests.log /tmp/detekt.log; do
              if [ -f "$f" ]; then
                echo "## $(basename "$f") — error/warning lines"
                echo ""
                echo '```'
                # Kotlin compiler uses `e:` and `w:` prefixes; KSP uses `error:`/`warning:`.
                # Cast a wide net.
                grep -nE '^(e:|w:|error:|warning:|FAILURE|FAILED|Caused by:|Compilation error|Unresolved reference|Cannot access|Type mismatch|Conflicting overloads)' "$f" || true
                echo '```'
                echo ""
                LINES=$(wc -l < "$f")
                echo "## $(basename "$f") — full log ($LINES lines)"
                echo ""
                echo '```'
                if [ "$LINES" -le 800 ]; then
                  cat "$f"
                else
                  echo "[truncated to first 200 + last 400 lines]"
                  head -200 "$f"
                  echo ""
                  echo "... ($((LINES-600)) lines elided) ..."
                  echo ""
                  tail -400 "$f"
                fi
                echo '```'
                echo ""
              fi
            done
            for xml in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
              if grep -q '<failure\|<error' "$xml" 2>/dev/null; then
                echo "## Failed test: $xml"
                echo ""
                echo '```xml'
                cat "$xml"
                echo '```'
                echo ""
              fi
            done
          } > "$OUT"
          # Also surface in the GitHub UI for users with repo access.
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Push diagnostic file back to the branch
        # Lets the agent that triggered this CI read the failure log via the
        # authenticated git API. The [skip ci] tag on the commit message
        # prevents an infinite trigger loop. Only runs on failure so green
        # builds don't keep committing back to the branch.
        if: failure()
        run: |
          if [ ! -f .ci_diag/last-run.md ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull latest in case other commits landed between trigger and now.
          git fetch origin "${{ github.ref_name }}" || true
          git checkout "${{ github.ref_name }}" || git checkout -b "${{ github.ref_name }}"
          mkdir -p .ci_diag
          cp /tmp/*.log .ci_diag/ 2>/dev/null || true
          git add .ci_diag
          if git diff --cached --quiet; then
            echo "no diagnostic changes"
            exit 0
          fi
          git commit -m "ci: diagnostic snapshot for run ${{ github.run_id }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "${{ github.ref_name }}"; then exit 0; fi
            git pull --rebase origin "${{ github.ref_name }}" || true
            sleep 2
          done
          exit 1

      - name: Fail job if any required step failed
        if: |
          steps.compile.outcome != 'success' ||
          steps.assemble.outcome != 'success' ||
          (steps.tests.outcome != 'success' && steps.tests.outcome != 'skipped')
        run: |
          echo "::error::Build pipeline incomplete. compile=${{ steps.compile.outcome }} assemble=${{ steps.assemble.outcome }} tests=${{ steps.tests.outcome }}"
          exit 1
